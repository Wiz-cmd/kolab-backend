# Render Blueprint for the Kolab API.
#
# IMPORTANT: this blueprint intentionally does NOT provision a Render database.
# Render's free Postgres expires after ~30 days, which caused the Oct 2026
# outage. Use a permanently-free Postgres (Neon) instead and paste its
# connection string into DATABASE_URL in the Render dashboard.
#
# Deploy: Render dashboard -> New + -> Blueprint -> connect Wiz-cmd/kolab-backend.

services:
  - type: web
    name: kolab-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Must match the actual service hostname (kolab-api-7r6i), otherwise
      # PayFast return URLs and password-reset links point at the wrong host.
      - key: APP_BASE_URL
        value: https://kolab-api-7r6i.onrender.com
      # Native clients do not need CORS. Add any real web origins here,
      # comma-separated — never use "*" in production.
      - key: CORS_ORIGINS
        value: https://kolab-api-7r6i.onrender.com
      - key: JWT_ACCESS_EXPIRES_IN
        value: 1h
      - key: JWT_EXPIRES_IN
        value: 1h
      # Keep the API surface closed in production.
      - key: SWAGGER_ENABLED
        value: "false"
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_STRUCTURED
        value: "true"
      - key: IMAGE_PROCESSING
        value: "false"
      - key: UPLOAD_DIR
        value: /tmp/kolab-uploads
      - key: JWT_SECRET
        generateValue: true
      # Set this in the Render dashboard (Environment tab) to your Neon
      # connection string. sync:false keeps Render from overwriting it.
      - key: DATABASE_URL
        sync: false
      # Optional: free AI via GitHub Models. Set in the dashboard.
      - key: GITHUB_MODELS_TOKEN
        sync: false
      - key: AI_BASE_URL
        value: https://models.github.ai/inference
      - key: AI_MODEL
        value: openai/gpt-4o-mini
